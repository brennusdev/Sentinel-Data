services:

  # =========================
  # API
  # =========================
  api:
    build: .

    container_name: sentinel-api

    command: >
      uvicorn
      app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    environment:
      APP_NAME: Sentinel Data
      ENVIRONMENT: development

      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      KAFKA_EVENTS_TOPIC: events.raw

      KAFKA_DLQ_TOPIC: events.dlq

      KAFKA_CONSUMER_GROUP: sentinel-event-processors

    depends_on:
      - postgres
      - kafka


  # =========================
  # KAFKA CONSUMER
  # =========================
  consumer:
    build: .

    container_name: sentinel-consumer

    command: >
      python
      -m
      app.streaming.consumer

    environment:

      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      KAFKA_EVENTS_TOPIC: events.raw

      KAFKA_DLQ_TOPIC: events.dlq

      KAFKA_CONSUMER_GROUP: sentinel-event-processors

    depends_on:
      - postgres
      - kafka


  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:16

    container_name: sentinel-postgres

    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel

    ports:
      - "5432:5432"

    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data


  # =========================
  # ZOOKEEPER
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1

    container_name: sentinel-zookeeper

    environment:

      ZOOKEEPER_CLIENT_PORT: 2181

      ZOOKEEPER_TICK_TIME: 2000


  # =========================
  # KAFKA
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.6.1

    container_name: sentinel-kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT:
        zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS:
        PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:
        PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME:
        PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"


volumes:

  sentinel_postgres_data: