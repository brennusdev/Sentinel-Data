services:

  api:
    build: .

    container_name: sentinel-api

    command: >
      uvicorn
      app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    environment:
      APP_NAME: Sentinel Data
      ENVIRONMENT: development

      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      KAFKA_EVENTS_TOPIC: events.raw

      KAFKA_PROCESSED_TOPIC: events.processed

      KAFKA_INVALID_TOPIC: events.invalid

      KAFKA_DLQ_TOPIC: events.dlq

      KAFKA_CONSUMER_GROUP: sentinel-event-processors

    depends_on:
      - postgres
      - kafka


  processor:
    build: .

    container_name: sentinel-processor

    command: >
      python
      -m
      app.streaming.consumer

    environment:

      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      KAFKA_EVENTS_TOPIC: events.raw

      KAFKA_PROCESSED_TOPIC: events.processed

      KAFKA_INVALID_TOPIC: events.invalid

      KAFKA_DLQ_TOPIC: events.dlq

      KAFKA_CONSUMER_GROUP: sentinel-event-processors

    depends_on:
      - postgres
      - kafka


  postgres:
    image: postgres:16

    container_name: sentinel-postgres

    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel

    ports:
      - "5432:5432"

    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1

    container_name: sentinel-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000


kafka:
  image: confluentinc/cp-kafka:7.6.1

  container_name: sentinel-kafka

  ports:
    - "9092:9092"

  environment:

    KAFKA_NODE_ID: 1

    KAFKA_PROCESS_ROLES: broker,controller

    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

    KAFKA_LISTENERS: >
      PLAINTEXT://:9092,
      CONTROLLER://:29093

    KAFKA_ADVERTISED_LISTENERS: >
      PLAINTEXT://kafka:9092

    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
      PLAINTEXT:PLAINTEXT,
      CONTROLLER:PLAINTEXT

    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk


volumes:

  sentinel_postgres_data:

  grafana:

  image: grafana/grafana:11.1.0

  container_name: sentinel-grafana

  ports:

    - "3000:3000"

  depends_on:

    - prometheus

  volumes:

    - grafana_data:/var/lib/grafana

prometheus:

  image: prom/prometheus:v2.53.0

  container_name: sentinel-prometheus

  ports:

    - "9090:9090"

  volumes:

    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  depends_on:

    - api
  
    