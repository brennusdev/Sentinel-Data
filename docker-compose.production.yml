services:

  api:

    build:

      context: .

      dockerfile: docker/Dockerfile

    container_name: sentinel-api

    env_file:

      - .env

    ports:

      - "8000:8000"

    restart: unless-stopped

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "scripts/health_check.py"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 10s