name: Sentinel CI


on:

  push:

    branches:

      - main

      - develop

  pull_request:

    branches:

      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v6


      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      - name: Upgrade pip

        run: |

          python -m pip install \
            --upgrade pip


      - name: Install dependencies

        run: |

          pip install \
            -e ".[dev]"


      - name: Lint

        run: |

          ruff check .


      - name: Tests

        run: |

          pytest


      - name: Coverage

        run: |

          pytest \
            --cov=app \
            --cov-report=term-missing


      - name: Security

        run: |

          bandit -r app