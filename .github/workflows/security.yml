name: Sentinel Security


on:

  pull_request:

    branches:

      - main


jobs:

  security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v6


      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          pip install \
            -e ".[dev]"


      - name: Bandit

        run: |

          bandit -r app


      - name: Dependency audit

        run: |

          pip-audit