[project]

name = "sentinel-data"

version = "6.0.0"

description = "Real-time data ingestion, processing, analytics and observability platform"

requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "alembic",
    "kafka-python",
    "polars",
    "prometheus-client",
    "structlog"
]


[project.optional-dependencies]

dev = [
    "pytest",
    "httpx",
    "ruff"
]


[tool.pytest.ini_options]

testpaths = [
    "tests"
]


[tool.ruff]

line-length = 88

target-version = "py312"