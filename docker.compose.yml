services:

  # =========================
  # API
  # =========================
  api:
    build: .
    container_name: sentinel-api

    command: >
      uvicorn
      app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    environment:
      APP_NAME: Sentinel Data
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - postgres
      - redis


  # =========================
  # WORKER
  # =========================
  worker:
    build: .

    container_name: sentinel-worker

    command: >
      celery
      -A app.core.celery.celery_app
      worker
      --loglevel=info

    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - postgres
      - redis


  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:16

    container_name: sentinel-postgres

    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel

    ports:
      - "5432:5432"

    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data


  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine

    container_name: sentinel-redis

    ports:
      - "6379:6379"

    volumes:
      - sentinel_redis_data:/data


volumes:

  sentinel_postgres_data:

  sentinel_redis_data: